# What this project means by the protocol's abstract words.
#
# AA/RULES.md is identical in every repo that uses this convention.
# THIS FILE IS THE ONLY THING THAT DIFFERS. A ledger, a lab, a law firm and a
# novel run the same rules and change the seven values below.
#
# Deliberately flat: `key: value` and `- item`, nothing nested beyond one
# level. board.sh parses it with sed. A config that needs a parser is a
# dependency, and this convention has exactly one (jq) already.

# ---------------------------------------------------------------------------
# A SPEND is anything this project cannot undo, or would pay for twice.
# Rules 5 (decision rules first) and 6 (checkpoint first) key off this word
# and off nothing else. Name the things that actually hurt here.
#
#   an ML project   gpu-hour, submission, api-credit
#   a law firm      filing, client-hour, expert-retainer
#   a newsroom      publication, source-burn
#   a novel         beta-reader-pass
#   a build         deploy, migration, customer-email
# ---------------------------------------------------------------------------
spend:
  - {{a thing you cannot undo}}
  - {{a thing you would pay for twice}}

# How many things can truly be in flight AT ONCE. Not an aspiration — the real
# constraint: one machine, one operator, one reviewer, one meter. A board with
# no limit is a push queue, and the board says so on every run until this is set.
wip:
  in_progress: {{N}}
  blocked: {{M}}

# A claim with no sign of life for this long is pullable (rule 4).
# Shorten it for fast work, lengthen it where a single item legitimately runs
# for days without a commit.
stale_hours: 24

# A run counts as running while it was heard from within this many minutes,
# but only when its process cannot be checked from here (another machine, or
# none recorded). On its own machine the process decides: alive is running,
# gone is closed (checkpoints/_SCHEMA.md). Always below stale_hours.
live_minutes: 30

# Where measured results land as they happen (rule 9).
log: PROGRESS.md

# What the system IS, stage by stage — named in AGENTS.md step 0 and read
# before a first task. Point at whatever already answers "how does this work":
# a README, an ARCHITECTURE.md, a case file, an outline. Do not create a rival.
map: {{README.md}}

# Task id prefix. T001, CASE-001, CH-01 — whatever reads naturally here.
# Ids are permanent and never renumbered; the slug after them may change.
id_prefix: T

# Rule 13. A task's working files, worktrees and builds live in <scratch>/T###/,
# usually git-ignored; `ckpt.sh release` deletes them when the task is done.
# First it keeps the files whose extension is in keep_kinds (documentation,
# visuals, metrics), outside virtualenvs, builds and checkouts git already has,
# plus every file the task's own file cites and whatever its `keeps:` line
# names. A file that looks like it holds a secret is archived, never committed. Up to keep_max_kb each they
# are committed to AA/evidence/T###/; bigger ones are copied to <archive>/T###/
# (outside the repository; ~ allowed) and their size and sha256 committed in
# AA/evidence/T###/RELEASED.tsv. With no archive, a release that has bigger
# ones refuses. Landed means an ancestor of `trunk` (default: origin/HEAD's
# branch, else main, else master).
scratch: scratch
keep_kinds: md txt rst html pdf png svg jpg jpeg gif webp mp4 webm mkv mov json jsonl csv tsv log yaml yml
keep_max_kb: 1024
# The most one task commits to AA/evidence/, in MB; over it the release refuses.
keep_task_mb: 100
archive: ~/Archive/{{repository name}}
